name: Profil widgetek

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/widgets.yml"

permissions:
  contents: write

concurrency:
  group: profil-widgetek
  cancel-in-progress: true

jobs:
  widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rendszerállapot-kártya és blog-lista
        run: node scripts/widgets.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: 3D hozzájárulási grafikon
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Képek összegyűjtése
        run: cp profile-3d-contrib/*.svg dist/

      - name: README mentése, ha változott a blog-lista
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Blog-lista frissítése" && git push)

      - name: Képek feltöltése az output branchre
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
